<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    color: #2C2C2A;
    background: #FDFCFA;
    padding: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #1D9E75, #0F6E56);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .title { font-size: 15px; font-weight: 600; }
  .subtitle { font-size: 11px; color: #888780; }
  label {
    display: block; font-size: 11.5px; font-weight: 500;
    color: #5F5E5A; margin-bottom: 5px; margin-top: 12px;
  }
  input, select {
    width: 100%; padding: 8px 10px; border: 1px solid #E8E6DF;
    border-radius: 6px; font-size: 12.5px; outline: none;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: #1D9E75; }
  .btn {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, #1D9E75, #0F6E56);
    color: #fff; font-size: 13px; font-weight: 500;
    cursor: pointer; margin-top: 16px; font-family: inherit;
  }
  .btn:hover { opacity: 0.9; }
  .status {
    text-align: center; font-size: 12px; color: #3B6D11;
    margin-top: 8px; display: none;
  }
  .divider { height: 1px; background: #E8E6DF; margin: 14px 0; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <div>
      <div class="title">Execla</div>
      <div class="subtitle">AI Email & Scheduling Assistant</div>
    </div>
  </div>

  <label>Claude API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-api03-..." />

  <label>Executive Name</label>
  <input type="text" id="execName" placeholder="e.g., Kayla D." />

  <label>Executive Role</label>
  <input type="text" id="execRole" placeholder="e.g., CEO, Execla" />

  <div class="divider"></div>

  <label>Reply Mode</label>
  <select id="replyMode">
    <option value="draft">Save as draft (review first)</option>
    <option value="insert">Insert into compose box</option>
  </select>

  <label>Earliest Meeting Time</label>
  <input type="time" id="earliestMeeting" value="10:00" />

  <label>Latest Meeting Time</label>
  <input type="time" id="latestMeeting" value="17:00" />

  <label>Max Meetings Per Day</label>
  <input type="number" id="maxMeetings" value="4" min="1" max="10" />

  <label>Buffer Between Meetings (minutes)</label>
  <input type="number" id="buffer" value="15" min="0" max="60" />

  <button class="btn" id="saveBtn">Save Settings</button>
  <div class="status" id="status">✓ Settings saved!</div>

  <script src="popup.js"></script>
</body>
</html>
